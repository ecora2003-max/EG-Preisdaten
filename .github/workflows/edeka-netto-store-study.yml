name: EDEKA Netto actual store-scoped source study
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_netto_market_source.py
      - .github/workflows/edeka-netto-store-study.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/edeka_netto_market_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edeka-netto-store-study
          path: results/edeka_netto_market_source.json
          retention-days: 7
