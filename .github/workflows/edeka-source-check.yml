name: EDEKA full priced catalogue source verification
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_catalogue_source_probe.py
      - .github/workflows/edeka-source-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check retail and web-store price catalogue sources
        run: python3 tools/edeka_catalogue_source_probe.py
      - name: Keep source probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edeka-catalogue-source-probe
          path: results/edeka_catalogue_source_probe_20261031.json
          retention-days: 7
