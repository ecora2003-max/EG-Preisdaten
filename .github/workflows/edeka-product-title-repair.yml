name: EDEKA product snapshot title quality repair
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_repair_product_titles.py
      - .github/workflows/edeka-product-title-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair and validate saved EDEKA product titles without further requests
        run: python3 tools/edeka_repair_product_titles.py
      - name: Commit checked product data corrections
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edeka/2026-10-31/product_page_subset*
          git commit -m "Fix 240 EDEKA product names and validate catalog subset"
          git push origin HEAD:main
