name: Netto on-site product search to price live test
on:
  push:
    branches: [main]
    paths:
      - tools/netto_search_to_online_price.py
      - .github/workflows/netto-search-to-price.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Search three terms and read official product JSON-LD EUR offers
        run: python3 tools/netto_search_to_online_price.py
      - name: Save measured prices and search scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netto-search-to-official-price
          path: results/netto_search_to_online_price_20261031.json
          retention-days: 7
