name: Reverse-engineer documented store catalog method signatures with JADX
on:
  push:
    branches: [main]
    paths:
      - tools/targeted_jadx_retailer_apis.py
      - .github/workflows/targeted-jadx-apis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decompile only product price API classes from retailer APKs
        run: python3 tools/targeted_jadx_retailer_apis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netto-kaufland-actual-api-signatures
          path: results/targeted_jadx_retailer_apis.json
          retention-days: 7
