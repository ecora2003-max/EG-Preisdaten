name: Independent EDEKA merchant online price access
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_shop_real_prices.py
      - .github/workflows/edeka-shop-prices.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/edeka_shop_real_prices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-edeka-shop-price-test
          path: results/edeka_shop_real_prices.json
          retention-days: 7
