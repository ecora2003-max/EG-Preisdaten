name: EDEKA authorized catalogue source discovery
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_catalogue_structure_probe_authorized.py
      - .github/workflows/edeka-catalogue-discovery-authorized.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDEKA_PERMISSION_CONFIRMED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe EDEKA product and store-priced offer source schemas
        run: python3 tools/edeka_catalogue_structure_probe_authorized.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edeka-product-market-catalogue-schemas
          path: results/edeka_catalogue_structure_probe_20261031.json
          retention-days: 7
