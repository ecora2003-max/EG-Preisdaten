name: PENNY next-week category coverage verification
on:
  push:
    branches: [main]
    paths:
      - tools/penny_category_discovery.py
      - .github/workflows/penny-category-coverage.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/penny_category_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penny-nextweek-category-results
          path: results/penny_all_categories.json
          retention-days: 7
