name: ALDI Nord public taxonomy navigation test
on:
  push:
    branches: [main]
    paths:
      - tools/aldi_navigation_paths.py
      - .github/workflows/aldi-navigation.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/aldi_navigation_paths.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aldi-navigation-index
          path: results/aldi_navigation_paths.json
          retention-days: 7
