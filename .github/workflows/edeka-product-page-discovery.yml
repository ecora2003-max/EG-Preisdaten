name: EDEKA authorized public product catalogue endpoint discovery
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_product_page_discovery.py
      - .github/workflows/edeka-product-page-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDEKA_PERMISSION_CONFIRMED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect product search entrypoints and metadata on EDEKA Sortiment
        run: python3 tools/edeka_product_page_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edeka-product-page-discovery
          path: results/edeka_product_page_discovery_20261031.json
          retention-days: 7
