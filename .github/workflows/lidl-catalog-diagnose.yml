name: Lidl documented catalogue response diagnosis
on:
  push:
    branches: [main]
    paths:
      - tools/lidl_catalog_error_inspection.py
      - .github/workflows/lidl-catalog-diagnose.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/lidl_catalog_error_inspection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lidl-catalogue-error-diagnosis
          path: results/lidl_product_catalog_error.json
          retention-days: 7
