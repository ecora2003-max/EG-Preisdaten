name: EDEKA authorized product sitemap inventory
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_product_sitemap_probe.py
      - .github/workflows/edeka-product-sitemap-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EDEKA_PERMISSION_CONFIRMED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect official EDEKA product sitemap and sample product pages
        run: python3 tools/edeka_product_sitemap_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edeka-product-sitemap-probe
          path: results/edeka_product_sitemap_probe_20261031.json
          retention-days: 7
