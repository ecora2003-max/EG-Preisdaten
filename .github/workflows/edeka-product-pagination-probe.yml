name: EDEKA public product search pagination diagnostics
on:
  push:
    branches: [main]
    paths:
      - tools/edeka_product_pagination_probe.py
      - .github/workflows/edeka-product-pagination-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      EDEKA_PERMISSION_CONFIRMED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check EDEKA product search pagination using safe read-only GETs
        run: python3 tools/edeka_product_pagination_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edeka-product-pagination-probe
          path: results/edeka_product_pagination_probe_20261031.json
          retention-days: 7
