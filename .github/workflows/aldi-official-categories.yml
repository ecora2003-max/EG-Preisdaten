name: ALDI Nord navigational catalogue coverage
on:
  push:
    branches: [main]
    paths:
      - tools/aldi_official_categories.py
      - .github/workflows/aldi-official-categories.yml
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/aldi_official_categories.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aldi-category-tree
          path: results/aldi_official_categories.json
          retention-days: 7
