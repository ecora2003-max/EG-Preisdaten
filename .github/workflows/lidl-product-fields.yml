name: Lidl offer product field check
on:
  push:
    branches: [main]
    paths:
      - tools/lidl_product_fields.py
      - .github/workflows/lidl-product-fields.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/lidl_product_fields.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lidl-product-fields
          path: results/lidl_product_fields.json
          retention-days: 7
