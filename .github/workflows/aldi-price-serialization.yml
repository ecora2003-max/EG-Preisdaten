name: ALDI Nord catalogue price serialization source
on:
  push:
    branches: [main]
    paths:
      - tools/aldi_price_serialization.py
      - .github/workflows/aldi-price-serialization.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/aldi_price_serialization.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aldi-price-serialization
          path: results/aldi_price_serialization.json
          retention-days: 7
